spring:
  application:
    name: report-service
  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mongo:
      enabled: ${MANAGEMENT_HEALTH_MONGO_ENABLED:false}

banquito:
  reports:
    storage-path: ${REPORT_STORAGE_PATH:./reports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  notification:
    grpc-host: ${NOTIFICATION_GRPC_HOST}
    grpc-port: ${NOTIFICATION_GRPC_PORT:9092}
    grpc-enabled: ${NOTIFICATION_GRPC_ENABLED:true}
logging:
  level:
    com.banquito.switchpayments.report: DEBUG
